specVersion: 1.3.0
description: NexMarkets V1 Base Sepolia indexed read model. Chain/RPC remains canonical.
repository: https://github.com/Domistro16/nexmarkets-prod
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NexPassFactory
    network: base-sepolia
    source:
      address: "0x8fDE37c4C1A60733c9842f336fc331c4C7d8eB41"
      abi: NexPassFactory
      startBlock: 46502081
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - ProtocolDeployment
        - Edition
      abis:
        - name: NexPassFactory
          file: ./abis/NexPassFactory.json
      eventHandlers:
        - event: EditionCreated(indexed address,indexed bytes32,indexed address,bytes32,address,address,uint32,bytes32)
          handler: handleEditionCreated
  - kind: ethereum
    name: NexLaunchRegistry
    network: base-sepolia
    source:
      address: "0x811D7B04d37118F71002c4abe112bc41161e3D53"
      abi: NexLaunchRegistry
      startBlock: 46502050
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Edition
        - TermsVersion
      abis:
        - name: NexLaunchRegistry
          file: ./abis/NexLaunchRegistry.json
      eventHandlers:
        - event: EditionRegistered(indexed address,indexed bytes32,indexed address,uint32)
          handler: handleEditionRegistered
        - event: TermsPublished(indexed address,indexed bytes32,indexed uint64,uint256,uint256,uint64,uint64,uint64,address,address,uint96,bytes32,bytes32)
          handler: handleTermsPublished
  - kind: ethereum
    name: NexMintController
    network: base-sepolia
    source:
      address: "0x38Ca185Bd179989bFCAa05aF61B0de837B8FcB97"
      abi: NexMintController
      startBlock: 46502079
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - PrimaryMint
      abis:
        - name: NexMintController
          file: ./abis/NexMintController.json
      eventHandlers:
        - event: PrimaryMintSettled(indexed address,indexed address,indexed address,bytes32,bytes32,uint256,uint256,uint256,uint256)
          handler: handlePrimaryMintSettled
        - event: ReferralHintSubmitted(indexed bytes32,indexed address,indexed address,address)
          handler: handleReferralHintSubmitted
  - kind: ethereum
    name: NexAdvantageRegistry
    network: base-sepolia
    source:
      address: "0xDe076a2D0F998a69A87226041E6075dAd534ECdD"
      abi: NexAdvantageRegistry
      startBlock: 46502083
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Pass
        - AdvantageState
        - AdvantageConsumption
      abis:
        - name: NexAdvantageRegistry
          file: ./abis/NexAdvantageRegistry.json
      eventHandlers:
        - event: PassAdvantagesInitialized(indexed address,indexed uint256,indexed bytes32,bytes32,uint256)
          handler: handlePassAdvantagesInitialized
        - event: PassListingStateSet(indexed address,indexed uint256,bool)
          handler: handlePassListingStateSet
        - event: AdvantageConsumed(indexed address,indexed uint256,indexed bytes32,address,bytes32,uint256,uint256)
          handler: handleAdvantageConsumed
  - kind: ethereum
    name: NexAdvantageInitializer
    network: base-sepolia
    source:
      address: "0x4c1F382354B83d6Eab5cc55c99015c232112c687"
      abi: NexAdvantageInitializer
      startBlock: 46502085
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Pass
        - AdvantageState
      abis:
        - name: NexAdvantageInitializer
          file: ./abis/NexAdvantageInitializer.json
      eventHandlers:
        - event: MintAdvantagesInitialized(indexed address,indexed uint256,uint256,indexed bytes32,bytes32)
          handler: handleMintAdvantagesInitialized
  - kind: ethereum
    name: NexListingRegistry
    network: base-sepolia
    source:
      address: "0x6F33B84325041d15443827540057763bCD3FEAD8"
      abi: NexListingRegistry
      startBlock: 46502089
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Listing
        - SecondarySale
      abis:
        - name: NexListingRegistry
          file: ./abis/NexListingRegistry.json
      eventHandlers:
        - event: ListingCreated(indexed bytes32,indexed address,indexed uint256,address,bytes32,uint256,address,uint96,uint64,uint64,bytes32)
          handler: handleListingCreated
        - event: ListingCancelled(indexed bytes32,indexed address)
          handler: handleListingCancelled
        - event: ListingFilled(indexed bytes32,indexed address)
          handler: handleListingFilled
        - event: SecondarySaleSettled(indexed bytes32,indexed address,uint256,uint256,uint256,uint256)
          handler: handleSecondarySaleSettled
        - event: ListingExpired(indexed bytes32)
          handler: handleListingExpired
        - event: ListingStale(indexed bytes32,indexed address)
          handler: handleListingStale
  - kind: ethereum
    name: NexRoyaltyVault
    network: base-sepolia
    source:
      address: "0x2A75E1568703B3fd2B692889e08f1Da0949bE618"
      abi: NexRoyaltyVault
      startBlock: 46502087
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - RoyaltyClaim
      abis:
        - name: NexRoyaltyVault
          file: ./abis/NexRoyaltyVault.json
      eventHandlers:
        - event: RoyaltyRecorded(indexed bytes32,indexed address,indexed uint256,address,uint256,uint64)
          handler: handleRoyaltyRecorded
        - event: RoyaltyWithdrawn(indexed bytes32,indexed address,uint256)
          handler: handleRoyaltyWithdrawn
  - kind: ethereum
    name: NexTBAResolver
    network: base-sepolia
    source:
      address: "0x31c249C0DC9A45756A9A2578EC9e3E316a31A9cD"
      abi: NexTBAResolver
      startBlock: 46502095
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - TokenBoundAccount
      abis:
        - name: NexTBAResolver
          file: ./abis/NexTBAResolver.json
      eventHandlers:
        - event: PassAccountCreated(indexed address,indexed uint256,indexed address)
          handler: handlePassAccountCreated
  - kind: ethereum
    name: ERC6551Registry
    network: base-sepolia
    source:
      address: "0x000000006551c19487814612e58FE06813775758"
      abi: ERC6551Registry
      startBlock: 46502081
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - TokenBoundAccount
      abis:
        - name: ERC6551Registry
          file: ./abis/ERC6551Registry.json
      eventHandlers:
        - event: ERC6551AccountCreated(address,indexed address,bytes32,uint256,indexed address,indexed uint256)
          handler: handleERC6551AccountCreated
  - kind: ethereum
    name: Seaport16
    network: base-sepolia
    source:
      address: "0x0000000000000068F116a894984e2DB1123eB395"
      abi: Seaport16
      startBlock: 46502089
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - SettlementEvidence
      abis:
        - name: Seaport16
          file: ./abis/Seaport16.json
      eventHandlers:
        - event: OrderFulfilled(indexed bytes32,indexed address,indexed address,address,(uint8,address,uint256,uint256)[],(uint8,address,uint256,uint256,address)[])
          handler: handleOrderFulfilled
templates:
  - kind: ethereum
    name: NexPassEdition
    network: base-sepolia
    source:
      abi: NexPassEdition
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Edition
        - Pass
        - PassTransfer
      abis:
        - name: NexPassEdition
          file: ./abis/NexPassEdition.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleEditionTransfer
        - event: EditionMinted(indexed address,indexed uint256,uint256,indexed bytes32,uint256,address,uint96)
          handler: handleEditionMinted
        - event: EditionConfigured(indexed bytes32,indexed bytes32,uint32)
          handler: handleEditionConfigured
        - event: MintControllerSet(indexed address)
          handler: handleEditionMintControllerSet
