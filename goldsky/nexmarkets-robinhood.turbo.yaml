name: nexmarkets-robinhood-v1
# Robinhood is not currently listed as a shared Goldsky dataset. Goldsky must
# enable a dedicated EVM chain slug before deployment. The deployment command
# replaces __ROBINHOOD_DATASET_PREFIX__ with the assigned mainnet/testnet slug.
sources:
  robinhood_logs:
    type: dataset
    dataset_name: __ROBINHOOD_DATASET_PREFIX__.raw_logs
    version: 1.0.0
    start_at: earliest
  robinhood_blocks:
    type: dataset
    dataset_name: __ROBINHOOD_DATASET_PREFIX__.raw_blocks
    version: 1.0.0
    start_at: earliest
transforms:
  nexmarkets_logs:
    type: sql
    primary_key: chain_id,transaction_hash,log_index
    sql: |
      SELECT
        l.chain_id,
        l.block_number,
        COALESCE(b.block_hash,l.block_hash) AS block_hash,
        l.transaction_hash,
        l.log_index,
        l.address AS contract_address,
        l.topic0,
        l.topics,
        l.data,
        COALESCE(b.block_timestamp,l.block_timestamp) AS block_timestamp,
        l.removed
      FROM robinhood_logs l
      LEFT JOIN robinhood_blocks b ON b.chain_id=l.chain_id AND b.block_number=l.block_number
      -- Topic filtering transports core events plus candidate dynamic-Edition
      -- events. The idempotent projector accepts Edition-scoped events only
      -- after NexPassFactory.EditionCreated registered that address.
      WHERE topic0 IN (__NEXMARKETS_EVENT_TOPIC0_LIST__)
  nexmarkets_watermarks:
    type: sql
    primary_key: chain_id,block_number
    sql: |
      SELECT
        chain_id,
        block_number,
        block_hash,
        block_timestamp,
        false AS removed
      FROM robinhood_blocks
sinks:
  postgres_events:
    type: postgres
    source: nexmarkets_logs
    table: goldsky_raw_log
    secret_name: NEXMARKETS_POSTGRES
    mode: upsert
    primary_key: chain_id,transaction_hash,log_index
  postgres_watermarks:
    type: postgres
    source: nexmarkets_watermarks
    table: goldsky_chain_watermark
    secret_name: NEXMARKETS_POSTGRES
    mode: upsert
    primary_key: chain_id,block_number
