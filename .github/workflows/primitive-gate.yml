name: robinhood-primitive-gate
on:
  workflow_dispatch:
jobs:
  mainnet:
    runs-on: ubuntu-latest
    env:
      RH_MAINNET_RPC_URL: ${{ secrets.RH_MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run verify:primitives:mainnet:strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: robinhood-mainnet-primitive-verification
          path: artifacts/primitive-verification/robinhood-mainnet.json
