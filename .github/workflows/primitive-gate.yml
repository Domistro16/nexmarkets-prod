name: robinhood-primitive-gate
on:
  workflow_dispatch:
jobs:
  mainnet:
    runs-on: ubuntu-latest
    env:
      RH_MAINNET_RPC_URL: ${{ secrets.RH_MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # This is expected to remain blocked until bootstrap manifests are replaced with pinned runtime hashes.
      - run: npm run verify:primitives:mainnet:strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robinhood-mainnet-primitive-verification
          path: artifacts/primitive-verification/robinhood-mainnet.json
