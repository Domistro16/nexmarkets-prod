name: phase01-ci
on:
  push:
  pull_request:
jobs:
  static:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: nexmarkets
          POSTGRES_PASSWORD: nexmarkets_ci
          POSTGRES_DB: nexmarkets
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexmarkets"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexmarkets:nexmarkets_ci@localhost:5432/nexmarkets
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run security:secrets
      - run: npm run verify:config
      - run: npm run verify:authority
      - run: npm run verify:schema
      - run: npm run verify:goldsky
      - run: npm run verify:production
      - run: npm run db:migrate
      - run: npm test
      - run: npm run web:build
      - run: npm run verify:checksums
      - run: node --check scripts/deploy-safe.mjs
      - run: node --check scripts/verify-safe-approval.mjs
      - run: node --check scripts/plan-v1-deployment.mjs
      - run: node --check scripts/deployment-source.mjs
      - run: node --check scripts/build-v1-safe-bundles.mjs
      - run: node --check scripts/verify-v1-deployment.mjs
      - run: node --check scripts/render-goldsky-config.mjs
      - run: node --check scripts/regenerate-checksums.mjs
      - run: node --check services/indexer/src/runtime.mjs
      - run: node --check services/indexer/src/run.mjs
      - run: node --check services/worker/src/chain-lifecycle.mjs
      - run: node --check services/worker/src/run-chain-worker.mjs
      - run: node --check services/reconciler/src/rpc-adapter.mjs
      - run: node --check services/reconciler/src/postgres-adapter.mjs
      - run: node --check services/reconciler/src/run.mjs
